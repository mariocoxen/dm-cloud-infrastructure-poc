<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DM Cloud Consulting - PoC</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background: #1e1e1e url('background.png') no-repeat center center fixed;
            background-size: contain;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px 60px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
        }
        h1 {
            color: #38bdf8;
            margin-bottom: 10px;
            font-size: 2.2rem;
        }
        p {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin: 8px 0;
        }
        .badge {
            display: inline-block;
            margin-top: 15px;
            padding: 6px 16px;
            background-color: #0284c7;
            color: #ffffff;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DM Cloud Consulting</h1>
        <p>Automated Infrastructure as Code (IaC) PoC Test</p>
        <div class="badge">Mario's Terraform+Docker+Git/Github Containerized PoC</div>
    </div>
</body>
</html>
